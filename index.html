<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB Supplies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">🛒 HB Supplies Inventory</h1>
    
    <div class="card mb-4">
      <div class="card-body">
        <h5>Add New Supply</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <input type="text" id="itemName" class="form-control" placeholder="Item name (e.g. Resistor)">
          </div>
          <div class="col-md-2">
            <input type="number" id="itemQty" class="form-control" placeholder="Quantity" value="1">
          </div>
          <div class="col-md-2">
            <input type="number" id="itemPrice" class="form-control" placeholder="Price $" step="0.01">
          </div>
          <div class="col-md-4">
            <button onclick="addItem()" class="btn btn-primary w-100">Add Item</button>
          </div>
        </div>
      </div>
    </div>

    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search items..." onkeyup="filterItems()">

    <table class="table table-striped" id="itemsTable">
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Total Value</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="totalValue" class="alert alert-info mt-3"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
